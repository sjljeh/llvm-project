# REQUIRES: arm
# RUN: yaml2obj %s -o %t.obj
# RUN: lld-link %t.obj %p/Inputs/library.lib /subsystem:console \
# RUN:   /entry:mainCRTStartup /alternatename:__delayLoadHelper2=mainCRTStartup \
# RUN:   /delayload:library.dll /out:%t.exe
# RUN: llvm-readobj --coff-imports %t.exe | FileCheck -check-prefix=IMPORT %s
# RUN: llvm-readobj --coff-basereloc %t.exe | FileCheck -check-prefix=BASEREL %s
# RUN: llvm-objdump --no-print-imm-hex -d %t.exe | FileCheck --check-prefix=DISASM %s
# RUN: llvm-readobj --file-headers %t.exe | FileCheck -check-prefix=DIR %s

# IMPORT:      Format: COFF-ARM
# IMPORT-NEXT: Arch: thumb
# IMPORT-NEXT: AddressSize: 32bit
# IMPORT-NEXT: DelayImport {
# IMPORT-NEXT:   Name: library.dll
# IMPORT-NEXT:   Attributes: 0x1
# IMPORT-NEXT:   ModuleHandle: 0x300C
# IMPORT-NEXT:   ImportAddressTable: 0x3004
# IMPORT-NEXT:   ImportNameTable: 0x2054
# IMPORT-NEXT:   BoundDelayImportTable: 0x2068
# IMPORT-NEXT:   UnloadDelayImportTable: 0x0
# IMPORT-NEXT:   Import {
# IMPORT-NEXT:     Symbol: function (0)
# IMPORT-NEXT:     Address: 0x401035
# IMPORT-NEXT:   }
# IMPORT-NEXT: }
#
# BASEREL:      BaseReloc [
# BASEREL-NEXT:   Entry {
# BASEREL-NEXT:     Type: ARM_MOV32(T)
# BASEREL-NEXT:     Address: 0x1000
# BASEREL-NEXT:   }
# BASEREL-NEXT:   Entry {
# BASEREL-NEXT:     Type: ARM_MOV32(T)
# BASEREL-NEXT:     Address: 0x101A
# BASEREL-NEXT:   }
# BASEREL-NEXT:   Entry {
# BASEREL-NEXT:     Type: ARM_MOV32(T)
# BASEREL-NEXT:     Address: 0x1034
# BASEREL-NEXT:   }
# BASEREL-NEXT:   Entry {
# BASEREL-NEXT:     Type: HIGHLOW
# BASEREL-NEXT:     Address: 0x1040
# BASEREL-NEXT:   }
# BASEREL-NEXT:   Entry {
# BASEREL-NEXT:     Type: HIGHLOW
# BASEREL-NEXT:     Address: 0x3004
# BASEREL-NEXT:   }
# BASEREL-NEXT:   Entry {
# BASEREL-NEXT:     Type: ABSOLUTE
# BASEREL-NEXT:     Address: 0x3000
# BASEREL-NEXT:   }
# BASEREL-NEXT: ]
#
# DISASM:    00401000 <.text>:
## As in link.exe, the tail-merge code comes before the delay-load thunk, which
## reaches it through a literal holding its address.
# DISASM:      40100c: e92d 480f       push.w  {r0, r1, r2, r3, r11, lr}
# DISASM-NEXT: 401010: f20d 0b10       addw    r11, sp, #16
# DISASM-NEXT: 401014: ed2d 0b10       vpush   {d0, d1, d2, d3, d4, d5, d6, d7}
# DISASM-NEXT: 401018: 4661            mov     r1, r12
# DISASM-NEXT: 40101a: f242 0014       movw    r0, #8212
# DISASM-NEXT: 40101e: f2c0 0040       movt    r0, #64
# DISASM-NEXT: 401022: f7ff ffed       bl      0x401000 <.text>
# DISASM-NEXT: 401026: 4684            mov     r12, r0
# DISASM-NEXT: 401028: ecbd 0b10       vpop    {d0, d1, d2, d3, d4, d5, d6, d7}
# DISASM-NEXT: 40102c: e8bd 480f       pop.w   {r0, r1, r2, r3, r11, lr}
# DISASM-NEXT: 401030: 4760            bx      r12
# DISASM-NEXT: 401032: 0000            movs    r0, r0
# DISASM-NEXT: 401034: f243 0c04       movw    r12, #12292
# DISASM-NEXT: 401038: f2c0 0c40       movt    r12, #64
# DISASM-NEXT: 40103c: f8df f000       ldr.w   pc, [pc, #0]
# DISASM-NEXT: 401040: 100d
# DISASM-NEXT: 401042: 0040
#
# DIR:         DelayImportDescriptorRVA: 0x2014
# DIR-NEXT:    DelayImportDescriptorSize: 0x40
#
# Like link.exe, describe how to unwind through the tail-merge code.
# RUN: llvm-readobj --unwind %t.exe | FileCheck -check-prefix=UNWIND %s
# UNWIND:      Function: 0x40100D
# UNWIND:        FunctionLength: 38
# UNWIND:        EpiloguePacked: Yes
# UNWIND:        EpilogueOffset: 6
# UNWIND:        ByteCodeLength: 12


--- !COFF
header:
  Machine:         IMAGE_FILE_MACHINE_ARMNT
  Characteristics: [  ]
sections:
  - Name:            .text
    Characteristics: [ IMAGE_SCN_CNT_CODE, IMAGE_SCN_MEM_PURGEABLE, IMAGE_SCN_MEM_16BIT, IMAGE_SCN_MEM_EXECUTE, IMAGE_SCN_MEM_READ ]
    Alignment:       4
    SectionData:     40F20000C0F2000000680047
    Relocations:
      - VirtualAddress:  0
        SymbolName:      __imp_function
        Type:            IMAGE_REL_ARM_MOV32T
  - Name:            .rdata
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ ]
    Alignment:       1
    SectionData:     01
  - Name:            .data
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ, IMAGE_SCN_MEM_WRITE ]
    Alignment:       1
    SectionData:     02
symbols:
  - Name:            .text
    Value:           0
    SectionNumber:   1
    SimpleType:      IMAGE_SYM_TYPE_NULL
    ComplexType:     IMAGE_SYM_DTYPE_NULL
    StorageClass:    IMAGE_SYM_CLASS_STATIC
    SectionDefinition:
      Length:          12
      NumberOfRelocations: 1
      NumberOfLinenumbers: 0
      CheckSum:        0
      Number:          1
  - Name:            mainCRTStartup
    Value:           0
    SectionNumber:   1
    SimpleType:      IMAGE_SYM_TYPE_NULL
    ComplexType:     IMAGE_SYM_DTYPE_FUNCTION
    StorageClass:    IMAGE_SYM_CLASS_EXTERNAL
  - Name:            __imp_function
    Value:           0
    SectionNumber:   0
    SimpleType:      IMAGE_SYM_TYPE_NULL
    ComplexType:     IMAGE_SYM_DTYPE_NULL
    StorageClass:    IMAGE_SYM_CLASS_EXTERNAL
...
