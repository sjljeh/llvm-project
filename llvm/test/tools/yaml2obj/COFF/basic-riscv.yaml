# RUN: yaml2obj %s -o %t
# RUN: llvm-readobj --file-headers --relocs %t | FileCheck %s
# RUN: obj2yaml %t | FileCheck %s --check-prefix=ROUNDTRIP

# CHECK: Format: COFF-RISCV64
# CHECK: Arch: riscv64
# CHECK: Machine: IMAGE_FILE_MACHINE_RISCV64 (0x5064)
# CHECK: Relocations [
# CHECK:   Section (1) .text {
# CHECK:     0x0 IMAGE_REL_RISCV_CALL function (0)
# CHECK:   }
# CHECK: ]

# ROUNDTRIP:      Machine: IMAGE_FILE_MACHINE_RISCV64
# ROUNDTRIP:      Relocations:
# ROUNDTRIP-NEXT: - VirtualAddress: 0
# ROUNDTRIP-NEXT:   SymbolName:     function
# ROUNDTRIP-NEXT:   Type:           IMAGE_REL_RISCV_CALL

--- !COFF
header:
  Machine: IMAGE_FILE_MACHINE_RISCV64
sections:
  - Name: .text
    Characteristics: [ IMAGE_SCN_CNT_CODE, IMAGE_SCN_MEM_EXECUTE, IMAGE_SCN_MEM_READ ]
    SectionData: 97000000E7800000
    Relocations:
      - VirtualAddress: 0
        SymbolName: function
        Type: IMAGE_REL_RISCV_CALL
symbols:
  - Name: function
    Value: 0
    SectionNumber: 0
    SimpleType: IMAGE_SYM_TYPE_NULL
    ComplexType: IMAGE_SYM_DTYPE_FUNCTION
    StorageClass: IMAGE_SYM_CLASS_EXTERNAL
...
